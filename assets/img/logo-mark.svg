      <stop offset="0%" stop-color="#19f5ff"/>
      <stop offset="50%" stop-color="#6b7dff"/>
      <stop offset="100%" stop-color="#f22eff"/>
    </linearGradient>
    <linearGradient id="nb" x1="10%" y1="15%" x2="90%" y2="85%">
